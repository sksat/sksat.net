<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rover-sim - sksat.net/sandbox</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="app">
    <header class="app-header">
      <h1><a href="/">sksat.net</a> / <a href="/sandbox/">sandbox</a> / rover-sim</h1>
      <span class="subtitle">JS で記述する探査機シミュレータ</span>
      <a class="tests-link" href="tests/">tests</a>
    </header>

    <div class="main">
      <div class="sim-pane" id="sim-pane">
        <div class="toolbar">
          <button id="btn-pause">⏸ 一時停止</button>
          <button id="btn-reset">⟲ リセット</button>
          <select id="sel-speed" title="シミュレーション速度">
            <option value="1" selected>x1</option>
            <option value="2">x2</option>
            <option value="4">x4</option>
            <option value="8">x8</option>
          </select>
          <select id="sel-view" title="地面の表示モード">
            <option value="color" selected>地面: 色</option>
            <option value="temp">地面: 温度</option>
          </select>
          <button id="btn-full">⛶ 全画面</button>
          <span class="status" id="status">--</span>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="canvas"></canvas>
        </div>
      </div>

      <div class="splitter" id="splitter" title="ドラッグで幅を変更"></div>

      <div class="ide-pane" id="ide-pane">
        <div class="ide-tabs">
          <button class="tab" data-tab="world">シミュレータ</button>
          <button class="tab active" data-tab="firmware">探査機</button>
          <span class="spacer"></span>
          <button id="btn-exec" class="primary" title="スクリプトを読み込んで最初から実行 (Ctrl+Enter)">▶ 実行</button>
          <select id="sel-sample" title="サンプルをエディタに読み込んで実行"></select>
        </div>
        <div class="editors">
          <div id="editor-world" class="editor-slot hidden"></div>
          <div id="editor-firmware" class="editor-slot"></div>
        </div>
        <div class="ide-bottom">
          <div class="monitor">
            <div class="monitor-col">
              <h2>テレメトリ</h2>
              <table id="sensor-table"></table>
            </div>
            <div class="monitor-col">
              <h2>アクチュエータ</h2>
              <table id="actuator-table"></table>
            </div>
          </div>
          <div class="console-box">
            <h2>コンソール</h2>
            <div id="console"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initApp } from './app.js';
    initApp();
  </script>
</body>

</html>
